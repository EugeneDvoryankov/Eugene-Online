services:
  - type: web
    name: onlinenow
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile.production
    healthCheckPath: /api/products
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onlinenow-db
          property: connectionString

databases:
  - name: onlinenow-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
